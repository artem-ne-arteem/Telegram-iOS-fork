name: Build Telegram IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # macOS 26: самый новый Xcode, с ним собирается самая свежая доступная версия Telegram.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          sw_vers
          df -h /

      - name: Free disk space
        run: |
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet ~/.dotnet ~/Library/Developer/CoreSimulator/Caches || true
          df -h /
          xcode-select -p

      - name: Clone Telegram-iOS (version compatible with this Xcode)
        run: python3 scripts/checkout_compatible.py tg

      - name: Apply our patches
        run: |
          shopt -s nullglob
          for p in patches/*.patch; do
            echo "Applying $p"
            git -C tg apply --whitespace=nowarn "$GITHUB_WORKSPACE/$p"
          done

      - name: Sideload compatibility fixes
        run: python3 scripts/sideload_fixes.py tg

      - name: "Feature: Reply from Preview"
        run: python3 scripts/feature_reply_from_preview.py tg

      - name: "Feature: Schedule Dial"
        run: python3 scripts/feature_schedule_dial.py tg

      - name: Refresh expired fake provisioning profiles
        run: python3 scripts/refresh_profiles.py tg/build-system/fake-codesigning

      - name: Import fake signing certificate
        run: |
          KC=build.keychain
          security create-keychain -p temp123 $KC
          security list-keychains -d user -s $KC $(security list-keychains -d user | tr -d '"')
          security set-keychain-settings $KC
          security unlock-keychain -p temp123 $KC
          find tg/build-system/fake-codesigning -name "*.p12" | while read -r p12; do
            echo "Importing $p12"
            security import "$p12" -k $KC -P "" -T /usr/bin/codesign -T /usr/bin/security
          done
          security set-key-partition-list -S apple-tool:,apple: -k temp123 $KC > /dev/null
          security find-identity -v -p codesigning $KC || true
          security find-identity -p codesigning $KC || true

      - name: Configuration
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: python3 scripts/make_config.py tg/build-system/appstore-configuration.json config.json

      - name: Restore Bazel cache
        uses: actions/cache/restore@v5
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ matrix.runner }}-${{ github.sha }}
          restore-keys: bazel-${{ matrix.runner }}-

      - name: Build
        working-directory: tg
        run: |
          set -o pipefail
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath="$GITHUB_WORKSPACE/config.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber=100001 \
            --configuration=release_arm64 2>&1 | tee "$GITHUB_WORKSPACE/build.log" || {
              grep -E "error:|ERROR:|Exception|Required Xcode|Could not" "$GITHUB_WORKSPACE/build.log" | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
              tail -15 "$GITHUB_WORKSPACE/build.log" | while IFS= read -r line; do echo "::warning::$line"; done
              df -h /
              exit 1
            }

      - name: Save Bazel cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ matrix.runner }}-${{ github.sha }}-${{ github.run_attempt }}

      - name: Collect IPA
        run: |
          IPA=tg/bazel-bin/Telegram/Telegram.ipa
          [ -f "$IPA" ] || IPA=$(find -L tg/bazel-bin tg/bazel-out -name "Telegram.ipa" -type f 2>/dev/null | head -1)
          echo "IPA: $IPA"
          cp "$IPA" Telegram.ipa
          ls -la Telegram.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: Telegram-ipa-${{ matrix.runner }}
          path: Telegram.ipa
